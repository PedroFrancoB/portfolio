<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lisbon Lora — Award</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #F4EDE4;
      --red: #CC3300;
      --dark: #1a1a1a;
      --light-text: #6b6b6b;
    }

    body {
      background: var(--cream);
      color: var(--dark);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }

    .back {
      position: fixed;
      top: 1.5rem;
      left: 2rem;
      text-decoration: none;
      color: var(--dark);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 100;
      transition: color 0.3s;
    }

    .back:hover { color: var(--red); }

    .header {
      padding: 8rem 3rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 400;
      font-style: italic;
      color: var(--red);
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--light-text);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: var(--red);
      margin: 2rem 0 3rem;
    }

    /* ========== CAROUSEL ========== */
    .carousel-wrapper {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 3rem;
      overflow: hidden;
    }

    .carousel {
      display: flex;
      transition: transform 0.5s ease;
    }

    .carousel img {
      width: 100%;
      min-width: 100%;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.3);
      border: none;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.3s, opacity 0.3s;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    .carousel-wrapper:hover .carousel-btn {
      opacity: 1;
    }

    .carousel-btn:hover {
      background: rgba(0,0,0,0.6);
    }

    .carousel-btn.prev {
      left: 3.5rem;
    }

    .carousel-btn.next {
      right: 3.5rem;
    }

    .carousel-btn.hidden {
      display: none;
    }

    /* Dots */
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .carousel-dots .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.15);
      cursor: pointer;
      transition: background 0.3s;
    }

    .carousel-dots .dot.active {
      background: var(--red);
    }

    /* ========== TEXT ========== */
    .award-text {
      max-width: 800px;
      margin: 3rem auto 6rem;
      padding: 0 3rem;
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--dark);
    }

    /* ========== LIGHTBOX ========== */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .lightbox .close-btn {
      position: absolute;
      top: 2rem; right: 2rem;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    @media (max-width: 768px) {
      .header { padding: 7rem 1.5rem 2rem; }
      .carousel-wrapper { padding: 0 1.5rem; }
      .carousel-btn.prev { left: 2rem; }
      .carousel-btn.next { right: 2rem; }
      .award-text { padding: 0 1.5rem; }
      .carousel-btn {
        width: 36px;
        height: 36px;
        font-size: 1rem;
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <a href="../index.html" class="back">← Back</a>

  <div class="header">
    <h1>Lisbon Lora</h1>
    <p>Award — December 2025</p>
    <div class="divider"></div>
  </div>

  <div class="carousel-wrapper">
    <button class="carousel-btn prev hidden" onclick="moveSlide(-1)">&#8249;</button>
    <button class="carousel-btn next" onclick="moveSlide(1)">&#8250;</button>

    <div class="carousel" onclick="openLightbox()">
      <img src="../media/award/photos_award/lisbon lora/LL_LETZ_JAN2622_a.jpg" alt="Lisbon Lora">
      <img src="../media/award/photos_award/lisbon lora/LL_LETZ_JAN2620 (1)_b.jpg" alt="Lisbon Lora">
      <img src="../media/award/photos_award/lisbon lora/LL_LETZ_EDITED22_c.jpg" alt="Lisbon Lora">
      <img src="../media/award/photos_award/lisbon lora/Untitled_Alignment_Adjustment_2_2026-03-01_20-38_d.jpg" alt="Lisbon Lora">
    </div>

    <div class="carousel-dots">
      <div class="dot active" onclick="goToSlide(0)"></div>
      <div class="dot" onclick="goToSlide(1)"></div>
      <div class="dot" onclick="goToSlide(2)"></div>
      <div class="dot" onclick="goToSlide(3)"></div>
    </div>
  </div>

  <p class="award-text">
    The artist was one of the winners in Lisbon Lora's December 2025 competition and was thus invited to speak about his creative process and show his short film "The Art Fair" in the RNA Studio — January 2026.
  </p>

  <div class="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <div id="lightbox-content"></div>
  </div>

  <script>
    let current = 0;
    const slides = document.querySelectorAll('.carousel img');
    const dots = document.querySelectorAll('.dot');
    const prevBtn = document.querySelector('.carousel-btn.prev');
    const nextBtn = document.querySelector('.carousel-btn.next');
    const total = slides.length;

    function updateCarousel() {
      document.querySelector('.carousel').style.transform = `translateX(-${current * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
      prevBtn.classList.toggle('hidden', current === 0);
      nextBtn.classList.toggle('hidden', current === total - 1);
    }

    function moveSlide(dir) {
      event.stopPropagation();
      current = Math.max(0, Math.min(total - 1, current + dir));
      updateCarousel();
    }

    function goToSlide(index) {
      current = index;
      updateCarousel();
    }

    function openLightbox() {
      const lightbox = document.querySelector('.lightbox');
      const container = document.getElementById('lightbox-content');
      container.innerHTML = '';
      const clone = document.createElement('img');
      clone.src = slides[current].src;
      clone.alt = slides[current].alt;
      container.appendChild(clone);
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      document.querySelector('.lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') moveSlide(1);
      if (e.key === 'ArrowLeft') moveSlide(-1);
    });
  </script>

</body>
</html>
